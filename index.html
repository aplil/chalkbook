<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chalkbook">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ECEFEE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1110" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Chalkbook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&display=swap">
<style>
/* Layout: iPhone-first training logbook. Chalk-grey ground, white "training card" tables for sets, a sticky tab title, a fixed bottom tab bar, bottom sheets for everything else. One accent (rubber-mat teal) for actions; hold-yellow is kept for XP and levels only. */
:root {
  --bg: #ECEFEE;
  --surface: #FFFFFF;
  --surface-2: #E1E6E4;
  --ink: #111614;
  --ink-2: #4A5550;
  --ink-3: #7F8A85;
  --line: #D3DAD7;
  --accent: #0F6B5C;
  --accent-ink: #FFFFFF;
  --accent-wash: #D5EAE5;
  --xp: #E2A900;
  --xp-ink: #221A00;
  --xp-wash: #FBEFC6;
  --good: #1E7A4C;
  --good-wash: #DCF0E4;
  --stop: #B3362D;
  --stop-wash: #F6DEDB;
  --c-strength: #3F5BA9;
  --c-calisthenics: #0F6B5C;
  --c-mobility: #7A4FB0;
  --c-conditioning: #BF4A2A;
  --c-climbing: #A06E05;
  --bar-bg: rgba(255,255,255,.86);
  --scrim: rgba(12,18,16,.45);
  --shadow: 0 1px 2px rgba(17,22,20,.06), 0 6px 20px rgba(17,22,20,.07);
  --f-display: "Archivo", "Arial Narrow", -apple-system, system-ui, sans-serif;
  --f-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  --tab-h: 62px;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1110; --surface: #161C1A; --surface-2: #202826; --ink: #EDF2F0; --ink-2: #A8B3AE; --ink-3: #74807B; --line: #29322F;
    --accent: #5CC9B2; --accent-ink: #03211B; --accent-wash: #11302A; --xp: #F3C63E; --xp-ink: #221A00; --xp-wash: #3A3112;
    --good: #5FD09A; --good-wash: #14301F; --stop: #F08B80; --stop-wash: #3A1F1C;
    --c-strength: #8FA6F0; --c-calisthenics: #5CC9B2; --c-mobility: #B999E8; --c-conditioning: #F08B6B; --c-climbing: #E6B54A;
    --bar-bg: rgba(22,28,26,.86); --scrim: rgba(0,0,0,.6); --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1110; --surface: #161C1A; --surface-2: #202826; --ink: #EDF2F0; --ink-2: #A8B3AE; --ink-3: #74807B; --line: #29322F;
  --accent: #5CC9B2; --accent-ink: #03211B; --accent-wash: #11302A; --xp: #F3C63E; --xp-ink: #221A00; --xp-wash: #3A3112;
  --good: #5FD09A; --good-wash: #14301F; --stop: #F08B80; --stop-wash: #3A1F1C;
  --c-strength: #8FA6F0; --c-calisthenics: #5CC9B2; --c-mobility: #B999E8; --c-conditioning: #F08B6B; --c-climbing: #E6B54A;
  --bar-bg: rgba(22,28,26,.86); --scrim: rgba(0,0,0,.6); --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font: 16px/1.45 var(--f-body); -webkit-tap-highlight-color: transparent; }
body.locked { overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 calc(var(--tab-h) + 96px + env(safe-area-inset-bottom, 0px)); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); display: flex; align-items: center; gap: 12px; padding-block: 14px 10px; }
.top h1 { margin: 0; flex: 1; font: 800 34px/1 var(--f-display); font-stretch: 78%; letter-spacing: -.01em; text-transform: uppercase; text-wrap: balance; }
.lvl { display: inline-flex; align-items: center; gap: 6px; border: 0; background: var(--xp-wash); color: var(--ink); border-radius: 999px; padding: 6px 12px 6px 6px; font: 700 14px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.lvl b { display: grid; place-items: center; min-width: 26px; height: 26px; border-radius: 999px; background: var(--xp); color: var(--xp-ink); font-size: 13px; padding: 0 6px; }
.icon-btn { border: 0; background: var(--surface); width: 40px; height: 40px; border-radius: 999px; display: grid; place-items: center; box-shadow: var(--shadow); font-size: 22px; line-height: 1; }

/* tab bar */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--bar-bg); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border-top: 1px solid var(--line); padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.tabs-in { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.tab { border: 0; background: none; display: grid; justify-items: center; gap: 2px; padding: 6px 0; color: var(--ink-3); font-size: 11px; font-weight: 600; letter-spacing: .02em; }
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--accent); }

/* common */
.sec { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 26px 0 10px; font: 700 13px/1.2 var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.sec button { border: 0; background: none; color: var(--accent); font-weight: 700; font-size: 14px; letter-spacing: 0; text-transform: none; padding: 4px 0; }
.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); }
.btn { border: 0; border-radius: 12px; padding: 12px 16px; font-weight: 700; background: var(--surface-2); color: var(--ink); min-height: 46px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.danger { background: var(--stop-wash); color: var(--stop); }
.btn.ghost { background: none; color: var(--accent); }
.btn.big { width: 100%; min-height: 56px; font-size: 18px; font-family: var(--f-display); font-stretch: 90%; letter-spacing: .01em; }
.btn:disabled { opacity: .5; }
.row-btns { display: flex; gap: 10px; flex-wrap: wrap; }
.row-btns .btn { flex: 1 1 140px; }
.muted { color: var(--ink-3); }
.small { font-size: 13px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--ink-2); }
.dot { width: 8px; height: 8px; border-radius: 99px; background: var(--c, var(--ink-3)); flex: none; }
.cat-strength { --c: var(--c-strength); } .cat-calisthenics { --c: var(--c-calisthenics); } .cat-mobility { --c: var(--c-mobility); } .cat-conditioning { --c: var(--c-conditioning); } .cat-climbing { --c: var(--c-climbing); }
.pill { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--surface-2); color: var(--ink-2); }
.pill.good { background: var(--good-wash); color: var(--good); }
.pill.xp { background: var(--xp-wash); color: var(--ink); }
.empty { padding: 28px 18px; text-align: center; color: var(--ink-3); }
.empty strong { display: block; color: var(--ink); font-size: 17px; margin-bottom: 4px; }
input.f, select.f, textarea.f { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 11px 12px; min-height: 44px; }
textarea.f { min-height: 96px; resize: vertical; }
label.lab { display: grid; gap: 6px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.form { display: grid; gap: 14px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.note { font-size: 13px; color: var(--ink-2); background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
.note.draft { background: var(--xp-wash); color: var(--ink); font-weight: 600; }
.search { position: relative; }
.search input { padding-left: 38px; }
.search svg { position: absolute; left: 12px; top: 50%; translate: 0 -50%; width: 18px; height: 18px; color: var(--ink-3); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.fchip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 12px; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.fchip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface-2); border-radius: 10px; padding: 3px; margin-bottom: 12px; }
.seg button { border: 0; background: none; border-radius: 8px; padding: 8px; font-weight: 700; font-size: 14px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

/* lists */
.list { display: grid; }
.li { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 0; background: none; text-align: left; width: 100%; border-bottom: 1px solid var(--line); }
.li:last-child { border-bottom: 0; }
.li .grow { flex: 1; min-width: 0; }
.li .t { font-weight: 650; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li .s { font-size: 13px; color: var(--ink-3); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li .tick { width: 26px; height: 26px; border-radius: 99px; border: 2px solid var(--line); display: grid; place-items: center; flex: none; font-size: 14px; font-weight: 800; }
.li[aria-pressed="true"] .tick { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chev { color: var(--ink-3); flex: none; }

/* train */
.routine { padding: 14px; display: grid; gap: 10px; }
.routine h4 { margin: 0; font: 750 19px/1.15 var(--f-display); font-stretch: 88%; }
.routine p { margin: 0; font-size: 13px; color: var(--ink-3); }
.routine .row-btns .btn { min-height: 40px; padding: 8px 12px; flex: 0 1 auto; }
.stack { display: grid; gap: 12px; }

/* active workout */
.wk-head { display: grid; gap: 4px; margin-top: 4px; }
.wk-title { border: 0; background: none; font: 800 24px/1.1 var(--f-display); font-stretch: 85%; padding: 2px 0; width: 100%; }
.wk-meta { display: flex; gap: 14px; flex-wrap: wrap; font-size: 14px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.wk-meta b { color: var(--ink); }
.exc { margin-top: 14px; padding: 12px 0 8px; }
.exc-h { display: flex; align-items: flex-start; gap: 8px; padding: 0 12px 0 14px; }
.exc-h .name { flex: 1; min-width: 0; border: 0; background: none; text-align: left; padding: 0; }
.exc-h .name b { display: block; font: 750 18px/1.2 var(--f-display); font-stretch: 90%; color: var(--accent); }
.exc-h .meta { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 3px; font-size: 12px; color: var(--ink-3); }
.more { border: 0; background: var(--surface-2); width: 34px; height: 34px; border-radius: 99px; font-weight: 800; letter-spacing: .05em; flex: none; }
.exc-note { margin: 8px 14px 4px; width: calc(100% - 28px); border: 0; background: none; font-size: 14px; color: var(--ink-2); padding: 4px 0; }
.stbl { margin-top: 6px; }
.srow { display: grid; grid-template-columns: 34px minmax(0, 1fr) var(--cols) 40px; gap: 6px; align-items: center; padding: 5px 10px 5px 8px; }
.srow.hd { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); padding-block: 2px; }
.srow.hd span { text-align: center; }
.srow.hd span:nth-child(2) { text-align: left; }
.srow.done { background: var(--good-wash); }
.stype { border: 0; background: var(--surface-2); border-radius: 8px; height: 32px; font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums; }
.stype.warmup { color: var(--xp-ink); background: var(--xp-wash); }
.stype.drop { color: var(--c-mobility); }
.stype.failure { color: var(--stop); }
.prev { font-size: 13px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-variant-numeric: tabular-nums; }
.prev .side { display: inline-block; border: 0; background: var(--surface-2); color: var(--ink); border-radius: 6px; padding: 1px 6px; margin-right: 4px; font-size: 11px; font-weight: 800; }
.cells { display: flex; gap: 6px; }
.cell { width: 100%; min-width: 0; height: 36px; border: 0; border-radius: 8px; background: var(--surface-2); text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; padding: 0 4px; }
.srow.done .cell { background: transparent; }
.cell::placeholder { color: var(--ink-3); font-weight: 600; }
.play { border: 0; background: var(--accent-wash); color: var(--accent); border-radius: 8px; height: 36px; min-width: 34px; font-weight: 800; flex: none; }
.check { border: 0; background: var(--surface-2); width: 40px; height: 36px; border-radius: 8px; font-weight: 900; font-size: 16px; color: var(--ink-3); }
.srow.done .check { background: var(--good); color: var(--surface); }
.exc-f { display: flex; gap: 8px; padding: 8px 12px 2px; }
.exc-f .btn { min-height: 38px; padding: 6px 12px; font-size: 14px; flex: 1; }
.exc-f .btn.sm { flex: 0 0 auto; }
.wk-actions { display: grid; gap: 10px; margin-top: 18px; }

/* rest bar */
.restbar { position: fixed; left: 0; right: 0; bottom: calc(var(--tab-h) + env(safe-area-inset-bottom, 0px)); z-index: 6; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); }
.restbar-in { max-width: 608px; margin: 0 auto; background: var(--ink); color: var(--bg); border-radius: 14px; padding: 8px 8px 8px 14px; display: flex; align-items: center; gap: 8px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
.restbar-in .fill { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--accent); }
.restbar-in .lbl { flex: 1; font-size: 13px; font-weight: 600; opacity: .8; }
.restbar-in .time { font: 800 24px/1 var(--f-display); font-variant-numeric: tabular-nums; min-width: 64px; }
.restbar-in button { border: 0; background: rgba(127,127,127,.25); color: inherit; border-radius: 10px; padding: 8px 10px; font-weight: 700; font-size: 14px; }

/* overlays: hold timer + guided player */
.overlay { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: grid; grid-template-rows: auto 1fr auto; padding: calc(16px + env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); }
.ov-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.ov-mid { display: grid; place-content: center; text-align: center; gap: 10px; }
.ov-phase { font-size: 13px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
.ov-phase.ready { color: var(--xp); }
.ov-name { font: 800 30px/1.1 var(--f-display); font-stretch: 85%; text-wrap: balance; margin: 0; }
.ov-side { font: 700 18px/1 var(--f-display); color: var(--ink-2); }
.ov-time { font: 800 clamp(84px, 30vw, 150px)/1 var(--f-display); font-stretch: 70%; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.ov-cue { color: var(--ink-2); max-width: 32ch; margin: 0 auto; }
.ov-next { font-size: 14px; color: var(--ink-3); }
.ov-prog { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin-top: 8px; }
.ov-prog i { display: block; height: 100%; background: var(--accent); }
.ov-bot { display: grid; grid-template-columns: 1fr 1.4fr 1fr; gap: 10px; }

/* sheets */
#sheets { position: fixed; inset: 0; z-index: 20; }
.scrim { position: absolute; inset: 0; background: var(--scrim); }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: calc(100% - 40px - env(safe-area-inset-top, 0px)); background: var(--bg); border-radius: 20px 20px 0 0; display: grid; grid-template-rows: auto 1fr; overflow: hidden; max-width: 640px; margin: 0 auto; }
.sheet-h { display: grid; grid-template-columns: 80px 1fr 80px; align-items: center; padding: 10px max(12px, env(safe-area-inset-left, 0px)) 8px max(12px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); }
.sheet-h h2 { margin: 0; text-align: center; font: 750 17px/1.2 var(--f-display); font-stretch: 92%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sheet-h .ghost { border: 0; background: none; color: var(--accent); font-weight: 650; justify-self: start; padding: 8px 4px; }
.sheet-h .sheet-x { justify-self: end; }
.sheet-h .sheet-x button { border: 0; background: none; color: var(--accent); font-weight: 800; padding: 8px 4px; }
.sheet-b { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 16px; align-content: start; }
.sheet-b h3 { margin: 0; font: 700 13px/1.2 var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.cues { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.kv div { background: var(--surface); border-radius: 12px; padding: 10px 12px; }
.kv span { display: block; font-size: 12px; color: var(--ink-3); font-weight: 600; }
.kv b { font: 750 20px/1.2 var(--f-display); font-variant-numeric: tabular-nums; }
.spark { width: 100%; height: 120px; display: block; }

/* progress */
.lvl-card { padding: 18px; display: grid; gap: 12px; }
.lvl-top { display: flex; align-items: center; gap: 16px; }
.lvl-badge { width: 72px; height: 72px; border-radius: 18px; background: var(--xp); color: var(--xp-ink); display: grid; place-content: center; text-align: center; flex: none; }
.lvl-badge small { font-size: 10px; font-weight: 800; letter-spacing: .12em; }
.lvl-badge b { font: 800 34px/1 var(--f-display); font-stretch: 80%; font-variant-numeric: tabular-nums; }
.bar { height: 10px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--xp); border-radius: 99px; }
.cats { display: grid; gap: 10px; }
.catrow { display: grid; grid-template-columns: 110px 1fr 46px; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; }
.catrow .bar { height: 6px; }
.catrow .bar i { background: var(--c); }
.catrow span:last-child { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); font-size: 13px; }
.streak { padding: 16px; display: grid; gap: 12px; }
.streak-top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.streak-top b { font: 800 40px/1 var(--f-display); font-stretch: 80%; font-variant-numeric: tabular-nums; }
.weekdots { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.weekdots i { width: 22px; height: 22px; border-radius: 6px; background: var(--surface-2); }
.weekdots i.on { background: var(--accent); }
.stepper { display: inline-flex; align-items: center; gap: 4px; background: var(--surface-2); border-radius: 10px; padding: 3px; }
.stepper button { border: 0; background: var(--surface); width: 32px; height: 30px; border-radius: 8px; font-weight: 800; }
.stepper span { min-width: 28px; text-align: center; font-weight: 800; font-variant-numeric: tabular-nums; }
.ach { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.ach div { background: var(--surface); border-radius: 12px; padding: 12px; display: grid; gap: 2px; }
.ach div.locked { background: transparent; border: 1px dashed var(--line); color: var(--ink-3); }
.ach b { font-size: 14px; }
.ach span { font-size: 12px; color: var(--ink-3); }
.ach .when { color: var(--good); font-weight: 700; }
.chart { padding: 14px 14px 8px; }
.chart svg { width: 100%; height: auto; display: block; }

/* ladders */
.ladder { padding: 14px; display: grid; gap: 10px; }
.ladder-h { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.ladder-h h4 { margin: 0; font: 750 19px/1.15 var(--f-display); font-stretch: 88%; }
.steps { display: grid; gap: 0; }
.step { display: grid; grid-template-columns: 24px 1fr auto; gap: 10px; align-items: center; border: 0; background: none; text-align: left; padding: 7px 0; position: relative; }
.step .n { width: 24px; height: 24px; border-radius: 99px; display: grid; place-items: center; font-size: 12px; font-weight: 800; background: var(--surface-2); color: var(--ink-3); position: relative; z-index: 1; }
.step.past .n { background: var(--accent-wash); color: var(--accent); }
.step.cur .n { background: var(--accent); color: var(--accent-ink); }
.step.cur .nm { font-weight: 750; }
.step .nm { font-size: 15px; }
.step:not(:last-child)::after { content: ""; position: absolute; left: 11px; top: 30px; height: calc(100% - 22px); width: 2px; background: var(--surface-2); }
.step .best { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }

#toast { position: fixed; left: 50%; translate: -50% 0; bottom: calc(var(--tab-h) + 80px + env(safe-area-inset-bottom, 0px)); z-index: 40; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14px; max-width: calc(100% - 32px); box-shadow: var(--shadow); opacity: 0; transition: opacity .2s; pointer-events: none; }
#toast.on { opacity: 1; }
.celebrate { animation: pop .5s ease-out; }
@keyframes pop { 0% { transform: scale(.9); } 60% { transform: scale(1.04); } 100% { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { .celebrate { animation: none; } #toast { transition: none; } }
@media (max-width: 380px) { .top h1 { font-size: 30px; } .srow { grid-template-columns: 30px minmax(0, .8fr) var(--cols) 38px; gap: 4px; } }
</style>

// ---------- UI state ----------
const UI = { tab: "train", libSeg: "exercises", q: "", cat: "all", climb: false };
try { const t = localStorage.getItem("chalkbook.tab"); if (["train", "library", "progress", "more"].includes(t)) UI.tab = t; } catch {}

// ---------- render: shell ----------
function render() {
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-current", b.dataset.tab === UI.tab ? "page" : "false"));
  const st = stats(), lv = levelOf(st.xp).level;
  const titles = { train: S.active ? "Workout" : "Train", library: "Library", progress: "Progress", more: "More" };
  $("#page-title").textContent = titles[UI.tab];
  $("#top-extra").innerHTML = UI.tab === "library"
    ? `<button class="icon-btn" data-a="lib-add" aria-label="Add exercise">+</button>`
    : `<button class="lvl" data-a="tab" data-tab="progress" aria-label="Level ${lv}"><b>${lv}</b>LVL</button>`;
  const v = $("#view");
  v.innerHTML = UI.tab === "train" ? (S.active ? viewWorkout() : viewTrain()) : UI.tab === "library" ? viewLibrary() : UI.tab === "progress" ? viewProgress() : viewMore();
  renderRest();
}

// ---------- train ----------
function viewTrain() {
  const recent = [...S.workouts].sort((a, b) => b.start - a.start).slice(0, 4);
  const st = stats();
  return `
  <div class="stack" style="margin-top:6px">
    <button class="btn primary big" data-a="start-empty">Start empty workout</button>
  </div>
  <h3 class="sec">Routines <button data-a="routine-new">New routine</button></h3>
  <div class="stack">${S.routines.map(r => `
    <div class="card routine">
      <div><h4>${esc(r.name)}</h4><p>${r.type === "mobility" ? "Guided mobility · " : ""}${esc(r.items.map(i => ex(i.exerciseId).name).join(", "))}</p></div>
      <div class="row-btns">
        <button class="btn primary" data-a="routine-start" data-id="${r.id}">${r.type === "mobility" ? "Start guided" : "Start"}</button>
        ${r.type === "mobility" ? `<button class="btn" data-a="routine-log" data-id="${r.id}">Log manually</button>` : ""}
        <button class="btn" data-a="routine-edit" data-id="${r.id}">Edit</button>
      </div>
    </div>`).join("") || `<div class="card empty"><strong>No routines yet</strong>Save a workout as a routine, or tap New routine.</div>`}
  </div>
  <h3 class="sec">Recent ${recent.length ? `<button data-a="tab" data-tab="progress">All history</button>` : ""}</h3>
  ${recent.length ? `<div class="card list">${recent.map(w => histRow(w, st)).join("")}</div>` : `<div class="card empty"><strong>Nothing logged yet</strong>Start a workout, or import your Hevy history from More.</div>`}`;
}
function histRow(w, st) {
  const sets = w.exercises.reduce((n, e) => n + e.sets.filter(s => s.done).length, 0);
  const mins = w.end ? Math.round((w.end - w.start) / 60000) : 0;
  return `<button class="li" data-a="hist-open" data-id="${w.id}"><span class="grow"><span class="t">${esc(w.title || "Workout")}</span><span class="s">${dayFmt(w.start)} · ${mins ? mins + " min · " : ""}${sets} ${sets === 1 ? "set" : "sets"}${w.source === "hevy" ? " · Hevy" : ""}</span></span><span class="pill xp">+${st.wxp[w.id] || 0} XP</span></button>`;
}

// ---------- active workout ----------
function newWorkout(title, items = []) {
  S.active = { id: uid(), title: title || defaultTitle(), start: Date.now(), notes: "", exercises: [] };
  for (const it of items) addExerciseToActive(it.exerciseId, it);
  save(); UI.tab = "train"; render(); keepAwake(true); window.scrollTo(0, 0);
}
function defaultTitle() { const h = new Date().getHours(); return (h < 11 ? "Morning" : h < 17 ? "Afternoon" : "Evening") + " session"; }
function addExerciseToActive(exId, it = {}) {
  const prev = lastSetsFor(exId, S.active.id);
  const n = it.sets || Math.max(1, Math.min(prev.length || 3, 6));
  const sets = [];
  for (let i = 0; i < n; i++) sets.push({ t: "normal", kg: null, reps: null, secs: null, dist: null, side: null, done: false });
  S.active.exercises.push({ exerciseId: exId, sets, rest: it.rest ?? (ex(exId).category === "mobility" ? 0 : S.settings.rest), note: "", target: { reps: it.reps || null, secs: it.secs || null } });
}
function placeholderFor(we, si, f, prev) {
  const p = prev[si] || prev[prev.length - 1];
  if (f === "mins") { if (p?.secs) return round(p.secs / 60, 1); return ""; }
  if (p && p[f] != null && p[f] !== "") return round(+p[f], 2);
  if (f === "reps" && we.target?.reps) return we.target.reps;
  if (f === "secs" && we.target?.secs) return we.target.secs;
  return "";
}
function viewWorkout() {
  const w = S.active;
  const done = w.exercises.reduce((n, e) => n + e.sets.filter(s => s.done).length, 0);
  return `
  <div class="wk-head">
    <input class="wk-title" id="wk-title" data-w="title" value="${esc(w.title)}" aria-label="Workout name">
    <div class="wk-meta"><span>Time <b data-elapsed>${clock((Date.now() - w.start) / 1000)}</b></span><span>Sets <b>${done}</b></span><span>Volume <b>${Math.round(volumeOf(w))} kg</b></span></div>
  </div>
  ${w.exercises.map((we, ei) => exCard(we, ei)).join("") || `<div class="card empty" style="margin-top:14px"><strong>Empty workout</strong>Add your first exercise to start logging.</div>`}
  <div class="wk-actions">
    <button class="btn primary big" data-a="pick-for-workout">Add exercise</button>
    <div class="row-btns"><button class="btn" data-a="wk-finish">Finish workout</button><button class="btn danger" data-a="wk-discard">Discard</button></div>
  </div>`;
}
function volumeOf(w) { let v = 0; for (const we of w.exercises) { if (ex(we.exerciseId).logType !== "weight_reps") continue; for (const s of we.sets) if (s.done) v += (+s.kg || 0) * (+s.reps || 0); } return v; }
function exCard(we, ei) {
  const e = ex(we.exerciseId), lt = e.logType, fs = fields(lt), prev = lastSetsFor(e.id, S.active.id), timed = isTimed(lt);
  const cols = fs.map(() => "minmax(0,1fr)").join(" ") + (timed ? " 34px" : "");
  return `<section class="card exc" style="--cols:${cols}">
    <div class="exc-h">
      <button class="name" data-a="ex-open" data-id="${e.id}"><b>${esc(e.name)}</b><span class="meta"><span class="chip cat-${e.category}"><span class="dot"></span>${CATS[e.category] || ""}</span>${we.rest ? `<span>Rest ${fmtSecs(we.rest)}</span>` : `<span>No rest timer</span>`}${e.isUnilateral ? "<span>Each side</span>" : ""}</span></button>
      <button class="more" data-a="ex-menu" data-ei="${ei}" aria-label="Options for ${esc(e.name)}">···</button>
    </div>
    <input class="exc-note" data-note="${ei}" placeholder="Add a note" value="${esc(we.note)}" aria-label="Note for ${esc(e.name)}">
    <div class="stbl">
      <div class="srow hd"><span>Set</span><span>Previous</span>${fs.map(f => `<span>${f[1]}</span>`).join("")}${timed ? "<span></span>" : ""}<span>✓</span></div>
      ${we.sets.map((s, si) => {
        const label = s.t === "warmup" ? "W" : s.t === "drop" ? "D" : s.t === "failure" ? "F" : String(we.sets.slice(0, si + 1).filter(x => x.t !== "warmup").length);
        const pv = prev[si] ? fmtSet(prev[si], lt) : "—";
        return `<div class="srow ${s.done ? "done" : ""}">
          <button class="stype ${s.t}" data-a="set-type" data-ei="${ei}" data-si="${si}" aria-label="Set type">${label}</button>
          <span class="prev">${e.isUnilateral ? `<button class="side" data-a="set-side" data-ei="${ei}" data-si="${si}" aria-label="Side">${s.side || "L+R"}</button>` : ""}${esc(pv)}</span>
          ${fs.map(([f, lab]) => { const val = f === "mins" ? (s.secs != null ? round(s.secs / 60, 2) : "") : (s[f] ?? ""); return `<input class="cell" data-ei="${ei}" data-si="${si}" data-f="${f}" inputmode="${f === "reps" || f === "secs" ? "numeric" : "decimal"}" value="${esc(val)}" placeholder="${esc(placeholderFor(we, si, f, prev))}" aria-label="${lab} set ${si + 1}">`; }).join("")}
          ${timed ? `<button class="play" data-a="hold" data-ei="${ei}" data-si="${si}" aria-label="Start hold timer">▶</button>` : ""}
          <button class="check" data-a="set-done" data-ei="${ei}" data-si="${si}" aria-label="Complete set ${si + 1}">✓</button>
        </div>`;
      }).join("")}
    </div>
    <div class="exc-f"><button class="btn" data-a="set-add" data-ei="${ei}">+ Add set</button><button class="btn sm" data-a="set-del" data-ei="${ei}" aria-label="Delete last set">− Set</button></div>
  </section>`;
}
function completeSet(ei, si, fromHold) {
  const we = S.active.exercises[ei], s = we.sets[si], e = ex(we.exerciseId), prev = lastSetsFor(e.id, S.active.id);
  if (s.done && !fromHold) { s.done = false; save(); render(); return; }
  for (const [f] of fields(e.logType)) {
    if (f === "mins") { if (s.secs == null) { const p = num(placeholderFor(we, si, f, prev)); if (p != null) s.secs = Math.round(p * 60); } continue; }
    if (s[f] == null || s[f] === "") { const p = num(placeholderFor(we, si, f, prev)); if (p != null) s[f] = p; }
  }
  const hasValue = fields(e.logType).some(([f]) => f === "mins" ? s.secs != null : s[f] != null);
  if (!hasValue) { toast("Enter a number first, then tick the set."); return; }
  s.done = true; unlockAudio();
  if (we.rest > 0) startRest(we.rest, e.name);
  save(); render();
}
function startRest(secs, name) { S.active.rest = { end: Date.now() + secs * 1000, total: secs, name, beeped: false }; }
function renderRest() {
  const bar = $("#restbar"), r = S.active?.rest;
  if (!r || UI.tab !== "train") { bar.hidden = true; return; }
  const left = (r.end - Date.now()) / 1000;
  bar.hidden = false;
  bar.innerHTML = `<div class="restbar-in"><span class="time" data-rest>${clock(left)}</span><span class="lbl">Rest · ${esc(r.name)}</span><button data-a="rest-adj" data-d="-15">−15</button><button data-a="rest-adj" data-d="15">+15</button><button data-a="rest-skip">Skip</button><i class="fill" style="width:${Math.max(0, Math.min(100, left / r.total * 100))}%"></i></div>`;
}
function tick() {
  const w = S.active; if (!w) return;
  const el = $("[data-elapsed]"); if (el) el.textContent = clock((Date.now() - w.start) / 1000);
  const r = w.rest;
  if (r) {
    const left = (r.end - Date.now()) / 1000;
    if (left <= 0) { if (!r.beeped) { beep(988, 180); setTimeout(() => beep(1318, 260), 220); toast("Rest's up. Next set."); } w.rest = null; save(); renderRest(); return; }
    const t = $("[data-rest]"); if (t) t.textContent = clock(left);
    const f = $(".restbar .fill"); if (f) f.style.width = Math.max(0, left / r.total * 100) + "%";
  }
}
setInterval(() => { tick(); tickOverlay(); }, 250);

async function finishWorkout() {
  const w = S.active;
  for (const we of w.exercises) we.sets = we.sets.filter(s => s.done);
  w.exercises = w.exercises.filter(we => we.sets.length);
  if (!w.exercises.length) {
    if (await confirmSheet("No completed sets", "Tick at least one set to save this workout. Discard it instead?", "Discard workout", true)) { S.active = null; save(); keepAwake(false); render(); }
    return;
  }
  const before = stats(); const beforeLv = levelOf(before.xp).level; const beforeUnl = { ...before.unlocked };
  w.end = Date.now(); delete w.rest;
  S.workouts.push(w); S.active = null; save(); statsCache = null; keepAwake(false);
  const after = stats();
  showSummary(w, before, beforeLv, beforeUnl, after);
  render();
}
function showSummary(w, before, beforeLv, beforeUnl, after) {
  const lvNow = levelOf(after.xp), newAch = ACH.filter(a => after.unlocked[a.id] && !beforeUnl[a.id]);
  const prs = after.wprs[w.id] || [];
  const holds = w.exercises.reduce((n, we) => isTimed(ex(we.exerciseId).logType) ? n + we.sets.reduce((m, s) => m + (+s.secs || 0), 0) : n, 0);
  const sets = w.exercises.reduce((n, we) => n + we.sets.length, 0);
  openSheet({ title: "Workout saved", render: () => `
    <div class="card lvl-card celebrate">
      <div class="lvl-top"><div class="lvl-badge"><small>LEVEL</small><b>${lvNow.level}</b></div><div style="flex:1;min-width:0"><div style="font:800 26px/1 var(--f-display)">+${after.wxp[w.id]} XP</div><div class="muted small">${lvNow.level > beforeLv ? `Level up! You reached level ${lvNow.level}.` : `${lvNow.need - lvNow.into} XP to level ${lvNow.level + 1}`}</div></div></div>
      <div class="bar"><i style="width:${lvNow.into / lvNow.need * 100}%"></i></div>
    </div>
    <div class="kv"><div><span>Duration</span><b>${fmtSecs((w.end - w.start) / 1000)}</b></div><div><span>Sets</span><b>${sets}</b></div><div><span>Volume</span><b>${Math.round(volumeOf(w))} kg</b></div><div><span>Hold time</span><b>${fmtSecs(holds)}</b></div></div>
    ${prs.length ? `<h3>Personal records</h3><div class="card list">${prs.map(p => `<div class="li"><span class="grow"><span class="t">${esc(ex(p.ex).name)}</span><span class="s">${METRIC_LABEL[p.k]}</span></span><span class="pill good">${fmtMetric(p.k, p.v)}</span></div>`).join("")}</div>` : ""}
    ${newAch.length ? `<h3>Achievements unlocked</h3><div class="ach">${newAch.map(a => `<div class="celebrate"><b>${esc(a.name)}</b><span>${esc(a.desc)}</span></div>`).join("")}</div>` : ""}
    <div class="row-btns"><button class="btn" data-a="wk-save-routine" data-id="${w.id}">Save as routine</button><button class="btn primary" data-a="sheet-close">Done</button></div>` });
}

// ---------- hold timer + guided mobility ----------
let OV = null;
function openHold(ei, si) {
  const we = S.active.exercises[ei], e = ex(we.exerciseId), s = we.sets[si], prev = lastSetsFor(e.id, S.active.id);
  const target = num(s.secs) || num(placeholderFor(we, si, "secs", prev)) || 30;
  unlockAudio(); keepAwake(true);
  OV = { kind: "hold", ei, si, name: e.name, cue: e.cues?.[0] || "", target, phase: "ready", phaseEnd: Date.now() + 3000, start: null, beeped: false };
  drawOverlay();
}
function startGuided(r) {
  const steps = [];
  for (const it of r.items) { const e = ex(it.exerciseId); const sides = it.perSide || e.isUnilateral ? ["Left", "Right"] : [null]; for (let k = 0; k < (it.sets || 1); k++) for (const side of sides) steps.push({ exId: e.id, side, secs: it.secs || 45 }); }
  if (!steps.length) { toast("Add exercises to this routine first."); return; }
  unlockAudio(); keepAwake(true);
  OV = { kind: "guided", routine: r, steps, i: 0, phase: "ready", phaseEnd: Date.now() + 5000, paused: null, start: Date.now(), log: [] };
  drawOverlay();
}
function drawOverlay() {
  const root = $("#overlay");
  if (!OV) { root.innerHTML = ""; document.body.classList.remove("locked"); return; }
  document.body.classList.add("locked");
  if (OV.kind === "hold") {
    root.innerHTML = `<div class="overlay" role="dialog" aria-label="Hold timer">
      <div class="ov-top"><span class="pill">Target ${fmtSecs(OV.target)}</span><button class="btn ghost" data-a="ov-cancel">Cancel</button></div>
      <div class="ov-mid"><div class="ov-phase" data-ov-phase></div><h2 class="ov-name">${esc(OV.name)}</h2><div class="ov-time" data-ov-time></div>${OV.cue ? `<p class="ov-cue">${esc(OV.cue)}</p>` : ""}</div>
      <div class="ov-bot" style="grid-template-columns:1fr"><button class="btn primary big" data-a="hold-done">Stop & log</button></div></div>`;
  } else {
    root.innerHTML = `<div class="overlay" role="dialog" aria-label="Guided mobility">
      <div class="ov-top"><span class="pill" data-ov-count></span><button class="btn ghost" data-a="ov-cancel">End</button></div>
      <div class="ov-mid"><div class="ov-phase" data-ov-phase></div><h2 class="ov-name" data-ov-name></h2><div class="ov-side" data-ov-side></div><div class="ov-time" data-ov-time></div><p class="ov-cue" data-ov-cue></p><div class="ov-next" data-ov-next></div><div class="ov-prog"><i data-ov-prog></i></div></div>
      <div class="ov-bot"><button class="btn" data-a="gd-back">Back</button><button class="btn primary" data-a="gd-pause" data-ov-pause>Pause</button><button class="btn" data-a="gd-skip">Skip</button></div></div>`;
  }
  tickOverlay();
}
function tickOverlay() {
  if (!OV) return;
  const now = Date.now(), set = (sel, txt) => { const el = $(sel); if (el && el.textContent !== txt) el.textContent = txt; };
  if (OV.kind === "hold") {
    if (OV.phase === "ready") { const left = (OV.phaseEnd - now) / 1000; set("[data-ov-phase]", "Get ready"); $("[data-ov-phase]")?.classList.add("ready"); set("[data-ov-time]", String(Math.max(1, Math.ceil(left)))); if (left <= 0) { OV.phase = "hold"; OV.start = now; beep(1046, 200); $("[data-ov-phase]")?.classList.remove("ready"); } return; }
    const el = (now - OV.start) / 1000;
    set("[data-ov-phase]", el >= OV.target ? "Target hit, keep going" : "Hold"); set("[data-ov-time]", clock(el).replace(/^0:/, ""));
    if (el >= OV.target && !OV.beeped) { OV.beeped = true; beep(988, 160); setTimeout(() => beep(1318, 300), 200); }
    return;
  }
  const st = OV.steps[OV.i]; if (!st) return;
  const e = ex(st.exId), paused = OV.paused != null;
  const left = ((paused ? OV.paused : OV.phaseEnd) - (paused ? 0 : now)) / 1000;
  set("[data-ov-count]", `${OV.i + 1} of ${OV.steps.length}`);
  set("[data-ov-phase]", paused ? "Paused" : OV.phase === "ready" ? (st.side === "Right" && OV.steps[OV.i - 1]?.exId === st.exId ? "Switch sides" : "Get ready") : "Hold");
  $("[data-ov-phase]")?.classList.toggle("ready", OV.phase === "ready");
  set("[data-ov-name]", e.name); set("[data-ov-side]", st.side ? st.side + " side" : ""); set("[data-ov-cue]", e.cues?.[0] || "");
  set("[data-ov-time]", clock(left));
  const nx = OV.steps[OV.i + 1]; set("[data-ov-next]", nx ? `Next: ${ex(nx.exId).name}${nx.side ? " (" + nx.side.toLowerCase() + ")" : ""}` : "Last one");
  set("[data-ov-pause]", paused ? "Resume" : "Pause");
  const pg = $("[data-ov-prog]"); if (pg) pg.style.width = (OV.i / OV.steps.length * 100) + "%";
  if (paused) return;
  if (OV.phase === "hold" && left <= 3.05 && left > 0 && OV.lastBeep !== Math.ceil(left)) { OV.lastBeep = Math.ceil(left); beep(660, 90, .12); }
  if (left <= 0) {
    if (OV.phase === "ready") { OV.phase = "hold"; OV.phaseEnd = now + st.secs * 1000; beep(1046, 200); }
    else { OV.log.push(OV.i); gdNext(); }
  }
}
function gdNext() {
  OV.i++;
  if (OV.i >= OV.steps.length) { beep(988, 160); setTimeout(() => beep(1318, 160), 180); setTimeout(() => beep(1568, 320), 360); finishGuided(); return; }
  OV.phase = "ready"; OV.phaseEnd = Date.now() + (OV.steps[OV.i].side === "Right" && OV.steps[OV.i - 1]?.exId === OV.steps[OV.i].exId ? 4000 : 6000); OV.lastBeep = null;
}
function finishGuided() {
  const o = OV; OV = null; drawOverlay(); keepAwake(false);
  const doneIdx = new Set(o.log); const exs = [];
  o.steps.forEach((st, i) => { if (!doneIdx.has(i)) return; let we = exs.find(x => x.exerciseId === st.exId); if (!we) exs.push(we = { exerciseId: st.exId, sets: [], rest: 0, note: "" }); we.sets.push({ t: "normal", secs: st.secs, side: st.side ? st.side[0] : null, done: true }); });
  if (!exs.length) { toast("Nothing completed, so nothing was logged."); return; }
  const before = stats(), beforeLv = levelOf(before.xp).level, beforeUnl = { ...before.unlocked };
  const w = { id: uid(), title: o.routine.name, start: o.start, end: Date.now(), notes: "", exercises: exs, routineId: o.routine.id };
  S.workouts.push(w); save(); statsCache = null;
  showSummary(w, before, beforeLv, beforeUnl, stats()); render();
}

// ---------- library ----------
function filteredExercises() {
  const q = UI.q.trim().toLowerCase();
  return allExercises().filter(e => (UI.cat === "all" || e.category === UI.cat || (UI.cat === "custom" && e.isCustom)) && (!UI.climb || e.climbingTransfer?.length) &&
    (!q || (e.name + " " + (e.primaryMuscles || []).join(" ") + " " + (e.equipment || "") + " " + (e.climbingTransfer || []).join(" ")).toLowerCase().includes(q)));
}
function viewLibrary() {
  return `<div class="seg" role="group" aria-label="Library view"><button data-a="lib-seg" data-seg="exercises" aria-pressed="${UI.libSeg === "exercises"}">Exercises</button><button data-a="lib-seg" data-seg="ladders" aria-pressed="${UI.libSeg === "ladders"}">Progressions</button></div>
  ${UI.libSeg === "ladders" ? viewLadders() : `
  <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input class="f" id="lib-q" type="search" placeholder="Search name, muscle, equipment" value="${esc(UI.q)}" aria-label="Search exercises"></div>
  ${catChips(UI.cat, UI.climb, "lib")}
  <div class="card list" id="lib-list" style="margin-top:8px">${libRows(filteredExercises(), "ex-open")}</div>`}`;
}
function catChips(cur, climb, scope) {
  const opts = [["all", "All"], ...Object.entries(CATS), ["custom", "Mine"]];
  return `<div class="chips" role="group" aria-label="Filter by category">${opts.map(([k, l]) => `<button class="fchip ${k !== "all" && k !== "custom" ? "cat-" + k : ""}" data-a="${scope}-cat" data-cat="${k}" aria-pressed="${cur === k}">${k !== "all" && k !== "custom" ? '<span class="dot"></span>' : ""}${l}</button>`).join("")}<button class="fchip" data-a="${scope}-climb" aria-pressed="${climb}">Climbing transfer</button></div>`;
}
function libRows(list, act, picked) {
  if (!list.length) return `<div class="empty"><strong>No matches</strong>Try another word, or add it as your own exercise with +.</div>`;
  return list.map(e => `<button class="li" data-a="${act}" data-id="${e.id}" ${picked ? `aria-pressed="${picked.has(e.id)}"` : ""}><span class="dot cat-${e.category}"></span><span class="grow"><span class="t">${esc(e.name)}</span><span class="s">${esc([LOGTYPES[e.logType], (e.primaryMuscles || []).slice(0, 2).join(", "), e.isCustom ? "Mine" : ""].filter(Boolean).join(" · "))}</span></span>${picked ? `<span class="tick">✓</span>` : `<svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m9 6 6 6-6 6"/></svg>`}</button>`).join("");
}
function viewLadders() {
  return `<div class="stack">${LIB.ladders.map(L => {
    const ls = ladderState(L), st = stats();
    return `<section class="card ladder"><div class="ladder-h"><h4>${esc(L.name)}</h4>${ls.ready ? `<span class="pill good">Ready to move up</span>` : ls.done ? `<span class="pill good">Ladder complete</span>` : `<span class="pill">Goal ${gradText(ls.g, ls.timed)} · ${ls.q}/2 sessions</span>`}</div>
      <div class="steps">${L.steps.map((id, i) => { const e = ex(id), b = st.best[id] || {}; const bk = ["secs", "reps", "kg"].find(k => b[k]); return `<button class="step ${i + 1 < ls.pos ? "past" : i + 1 === ls.pos ? "cur" : ""}" data-a="ladder-set" data-l="${L.id}" data-p="${i + 1}"><span class="n">${i + 1}</span><span class="nm">${esc(e.name)}</span><span class="best">${bk ? fmtMetric(bk, b[bk]) : ""}</span></button>`; }).join("")}</div>
      <p class="muted small" style="margin:0">Tap a step to mark where you are. Move up after ${gradText(ls.g, ls.timed)} on two separate days.</p></section>`;
  }).join("")}</div>`;
}
function exerciseDetail(id) {
  const e = ex(id), st = stats(), b = st.best[id] || {};
  const hist = S.workouts.filter(w => w.exercises.some(x => x.exerciseId === id && x.sets.some(s => s.done))).sort((a, c) => c.start - a.start);
  const key = e.logType === "weight_reps" ? "e1rm" : isTimed(e.logType) ? "secs" : e.logType === "distance_duration" ? "dist" : e.logType === "weighted_bodyweight" && b.kg ? "kg" : "reps";
  const pts = hist.slice(0, 30).reverse().map(w => { let m = 0; for (const we of w.exercises) if (we.exerciseId === id) for (const s of we.sets) if (s.done) m = Math.max(m, metrics(s, e.logType)[key] || 0); return { t: w.start, v: m }; }).filter(p => p.v > 0);
  const ladder = LIB.ladders.find(L => L.steps.includes(id));
  return `
  <div class="chip cat-${e.category}"><span class="dot"></span>${CATS[e.category]} · ${LOGTYPES[e.logType]}${e.isUnilateral ? " · each side" : ""}${e.isCustom ? " · Mine" : ""}</div>
  ${["kg", "e1rm", "reps", "secs", "dist"].some(k => b[k]) ? `<div class="kv">${["kg", "e1rm", "reps", "secs", "dist"].filter(k => b[k]).map(k => `<div><span>${METRIC_LABEL[k]}</span><b>${fmtMetric(k, b[k])}</b></div>`).join("")}</div>` : ""}
  ${pts.length > 1 ? `<div class="card chart">${sparkline(pts, key)}</div>` : ""}
  ${e.cues?.length ? `<div><h3>Cues</h3><ul class="cues" style="margin-top:8px">${e.cues.map(c => `<li>${esc(c)}</li>`).join("")}</ul></div>` : ""}
  <div class="kv">
    ${e.primaryMuscles?.length ? `<div><span>Main muscles</span>${esc(e.primaryMuscles.join(", "))}</div>` : ""}
    ${e.secondaryMuscles?.length ? `<div><span>Also works</span>${esc(e.secondaryMuscles.join(", "))}</div>` : ""}
    ${e.equipment ? `<div><span>Equipment</span>${esc(e.equipment)}</div>` : ""}
    ${e.climbingTransfer?.length ? `<div><span>Climbing transfer</span>${esc(e.climbingTransfer.join(", "))}</div>` : ""}
  </div>
  ${ladder ? `<div class="note">Step ${ladder.steps.indexOf(id) + 1} of ${ladder.steps.length} in the ${esc(ladder.name)} progression.</div>` : ""}
  ${e.notes ? `<div class="note">${esc(e.notes)}</div>` : ""}
  ${e.source ? `<div class="note">Source: ${/^https?:\/\//.test(e.source) ? `<a href="${esc(e.source)}" target="_blank" rel="noopener">${esc(e.source)}</a>` : esc(e.source)}</div>` : ""}
  ${hist.length ? `<div><h3>History</h3><div class="card list" style="margin-top:8px">${hist.slice(0, 8).map(w => { const we = w.exercises.find(x => x.exerciseId === id); return `<div class="li"><span class="grow"><span class="t">${dayFmt(w.start)}</span><span class="s">${esc(we.sets.filter(s => s.done).map(s => fmtSet(s, e.logType)).join(" · "))}</span></span></div>`; }).join("")}</div></div>` : `<p class="muted" style="margin:0">Not logged yet.</p>`}
  <div class="row-btns">${S.active ? `<button class="btn primary" data-a="ex-add-active" data-id="${id}">Add to workout</button>` : ""}<button class="btn" data-a="ex-edit" data-id="${id}">Edit</button><button class="btn" data-a="ex-dup" data-id="${id}">Duplicate</button>${e.isCustom ? `<button class="btn danger" data-a="ex-del" data-id="${id}">Delete</button>` : ""}</div>`;
}
function sparkline(pts, key) {
  const W = 320, H = 120, pl = 8, pr = 52, pt = 12, pb = 18;
  const vs = pts.map(p => p.v), lo = Math.min(...vs), hi = Math.max(...vs), span = hi - lo || 1;
  const x = i => pl + i * (W - pl - pr) / Math.max(1, pts.length - 1), y = v => pt + (1 - (v - lo) / span) * (H - pt - pb);
  const line = pts.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join("");
  const area = `${line}L${x(pts.length - 1).toFixed(1)},${H - pb}L${pl},${H - pb}Z`;
  const last = pts[pts.length - 1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="${METRIC_LABEL[key]} over the last ${pts.length} sessions">
    <line x1="${pl}" x2="${W - pr}" y1="${y(hi)}" y2="${y(hi)}" stroke="var(--line)" stroke-dasharray="3 4"/><line x1="${pl}" x2="${W - pr}" y1="${y(lo)}" y2="${y(lo)}" stroke="var(--line)" stroke-dasharray="3 4"/>
    <path d="${area}" fill="var(--accent-wash)"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(pts.length - 1)}" cy="${y(last.v)}" r="4" fill="var(--accent)"/>
    <text x="${W - pr + 6}" y="${y(hi) + 4}" font-size="11" fill="var(--ink-2)" font-weight="700">${fmtMetric(key, hi)}</text>
    ${hi !== lo ? `<text x="${W - pr + 6}" y="${y(lo) + 4}" font-size="11" fill="var(--ink-3)">${fmtMetric(key, lo)}</text>` : ""}
    <text x="${pl}" y="${H - 3}" font-size="10" fill="var(--ink-3)">${dateFmt(pts[0].t)}</text><text x="${W - pr}" y="${H - 3}" font-size="10" fill="var(--ink-3)" text-anchor="end">${dateFmt(last.t)}</text>
  </svg>`;
}

function saveExerciseForm() {
  const d = topSheet().data;
  if (!String(d.name || "").trim()) { toast("Give the exercise a name."); return; }
  const isNew = !d.id || !S.exercises[d.id];
  if (isNew) { let base = "my-" + d.name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, ""), id = base, n = 2; while (S.exercises[id]) id = base + "-" + n++; d.id = id; d.isCustom = true; }
  else if (!S.exercises[d.id].isCustom) d.edited = true;
  S.exercises[d.id] = { primaryMuscles: [], secondaryMuscles: [], cues: [], climbingTransfer: [], ...d, name: d.name.trim() };
  save(); sheets.pop();
  const under = topSheet();
  if (under?.pickTarget) { if (isNew && !under.data.picked.has(d.id)) { under.data.picked.add(d.id); under.data.order.push(d.id); } under.data.q = ""; }
  else sheets.length = 0;
  drawSheets(true); toast(isNew ? "Exercise added" : "Exercise updated");
  render();
}

// ---------- creator import (AI draft) ----------
function aiPrompt(d) {
  return `Help me fill in an exercise card for my personal workout tracker. Reply with ONLY a JSON object and no other text, using these keys:
name (string, clear common name), category (one of: strength, calisthenics, mobility, conditioning, climbing), logType (one of: weight_reps, bodyweight_reps, assisted_reps, weighted_bodyweight, duration, weighted_duration, distance_duration), primaryMuscles (array of strings), secondaryMuscles (array), equipment (string), cues (array of 3 to 5 short coaching cues), isUnilateral (boolean), climbingTransfer (array, e.g. "grip", "lock-off", "core tension", "shoulder stability"; empty if it doesn't help climbing), easier (string, an easier variation), harder (string, a harder variation), source (the creator's name if known, else "").
You can't watch the video. Work from the link, title, channel and my notes. If you're unsure which exact exercise it is, make a sensible best guess and keep the cues general.

Link: ${d.link || "(none)"}
Video title: ${d.vtitle || "(unknown)"}
Channel: ${d.channel || "(unknown)"}
My notes: ${d.notes || "(none)"}`;
}
function parseDraft(text) {
  const m = String(text || "").match(/\{[\s\S]*\}/); if (!m) throw new Error("no json");
  const j = JSON.parse(m[0]);
  const draft = { name: String(j.name || "").trim(), category: CATS[j.category] ? j.category : "strength", logType: LOGTYPES[j.logType] ? j.logType : "weight_reps",
    primaryMuscles: [].concat(j.primaryMuscles || []).map(String), secondaryMuscles: [].concat(j.secondaryMuscles || []).map(String), equipment: String(j.equipment || ""),
    cues: [].concat(j.cues || []).map(String).slice(0, 6), isUnilateral: !!j.isUnilateral, climbingTransfer: [].concat(j.climbingTransfer || []).map(String),
    source: String(j.source || ""), notes: [j.easier ? "Easier: " + j.easier : "", j.harder ? "Harder: " + j.harder : ""].filter(Boolean).join("\n") };
  return draft;
}
function creatorImport() {

async function fetchVideoInfo(d) {
  if (!/youtu\.?be/.test(d.link)) return;
  try { const r = await fetch("https://www.youtube.com/oembed?format=json&url=" + encodeURIComponent(d.link)); if (r.ok) { const j = await r.json(); d.vtitle = j.title || ""; d.channel = j.author_name || ""; } } catch {}
}

// ---------- progress ----------
function viewProgress() {
  const st = stats(), lv = levelOf(st.xp), target = S.settings.weeklyTarget;
  const weeks = []; let k = weekKey(Date.now()); for (let i = 0; i < 12; i++) { weeks.unshift({ k, n: st.weeks[k] || 0 }); k = prevWeek(k); }
  const maxN = Math.max(target, ...weeks.map(w => w.n), 1);
  const all = [...S.workouts].sort((a, b) => b.start - a.start);
  const W = 336, H = 150, pl = 22, pb = 22, bw = (W - pl) / 12;
  return `
  <div class="card lvl-card">
    <div class="lvl-top"><div class="lvl-badge"><small>LEVEL</small><b>${lv.level}</b></div><div style="flex:1;min-width:0"><div style="font:800 24px/1.1 var(--f-display);font-variant-numeric:tabular-nums">${st.xp.toLocaleString("en-AU")} XP</div><div class="muted small">${(lv.need - lv.into).toLocaleString("en-AU")} XP to level ${lv.level + 1}</div></div></div>
    <div class="bar" role="progressbar" aria-valuenow="${Math.round(lv.into / lv.need * 100)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${lv.into / lv.need * 100}%"></i></div>
    <div class="cats">${Object.entries(CATS).map(([c, l]) => { const cl = levelOf(st.cat[c] || 0); return `<div class="catrow cat-${c}"><span class="chip" style="font-size:14px;color:var(--ink)"><span class="dot"></span>${l}</span><span class="bar"><i style="width:${cl.into / cl.need * 100}%"></i></span><span>Lv ${cl.level}</span></div>`; }).join("")}</div>
  </div>
  <h3 class="sec">Weekly streak</h3>
  <div class="card streak">
    <div class="streak-top"><b>${st.streak}</b><span>${st.streak === 1 ? "week" : "weeks"} in a row · best ${st.bestStreak}</span></div>
    <div class="weekdots" aria-label="${st.thisWeek} of ${target} sessions this week">${Array.from({ length: Math.max(target, st.thisWeek) }, (_, i) => `<i class="${i < st.thisWeek ? "on" : ""}"></i>`).join("")}<span class="muted small" style="margin-left:6px">${st.thisWeek}/${target} this week</span></div>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap"><span class="small muted">Rest days never break a streak. Hit your weekly target.</span><span class="stepper" aria-label="Weekly target"><button data-a="target" data-d="-1" aria-label="Fewer sessions">−</button><span>${target}</span><button data-a="target" data-d="1" aria-label="More sessions">+</button></span></div>
  </div>
  <h3 class="sec">Sessions per week</h3>
  <div class="card chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Sessions per week for the last 12 weeks">
    ${[0, Math.ceil(maxN / 2), maxN].filter((v, i, a) => a.indexOf(v) === i).map(v => { const y = 8 + (1 - v / maxN) * (H - pb - 8); return `<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${pl - 6}" y="${y + 4}" font-size="10" text-anchor="end" fill="var(--ink-3)">${v}</text>`; }).join("")}
    ${(() => { const y = 8 + (1 - target / maxN) * (H - pb - 8); return `<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--xp)" stroke-width="1.5" stroke-dasharray="4 4"/>`; })()}

// ---------- Hevy import ----------
function parseCSV(text) {
  text = text.replace(/^﻿/, ""); const rows = []; let row = [], f = "", q = false;

    else if (c === '"') q = true;
    else if (c === ",") { row.push(f); f = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; }
    else f += c;
  }

}
const MON = { jan: 0, feb: 1, mar: 2, apr: 3, may: 4, jun: 5, jul: 6, aug: 7, sep: 8, oct: 9, nov: 10, dec: 11 };
function parseDate(s) {

  if ((m = s.match(/^([A-Za-z]{3})[A-Za-z]*\.?\s+(\d{1,2}),?\s+(\d{4}),?\s+(\d{1,2}):(\d{2})\s*([ap]m)?/i))) { let h = +m[4]; if (m[6]) { if (/pm/i.test(m[6]) && h < 12) h += 12; if (/am/i.test(m[6]) && h === 12) h = 0; } return new Date(+m[3], MON[m[1].toLowerCase()], +m[2], h, +m[5]).getTime(); }
  const t = Date.parse(s); return isNaN(t) ? null : t;
}
const normName = n => String(n || "").toLowerCase().replace(/\(([^)]*)\)/g, (_, inner) => /weight|assist|band/.test(inner) ? " " + inner : "").replace(/[^a-z0-9]/g, "");
function hash(s) { let h = 5381; for (let i = 0; i < s.length; i++) h = (h * 33 ^ s.charCodeAt(i)) >>> 0; return h.toString(36); }

  const workouts = new Map(), names = new Map();
  for (const r of rows.slice(1)) {
    const title = g(r, "title"), startS = g(r, "start_time"), exT = g(r, "exercise_title"); if (!exT || !startS) continue;
    const key = title + "|" + startS;
    let w = workouts.get(key);
    if (!w) { const start = parseDate(startS); if (start == null) continue; w = { id: "hevy-" + hash(key), title: title || "Workout", start, end: parseDate(g(r, "end_time")) || null, notes: g(r, "description"), exercises: [], source: "hevy", _map: new Map() }; workouts.set(key, w); }

function hevyCommit() {

// ---------- backup ----------
async function exportBackup() {
  const data = JSON.stringify({ app: "chalkbook", exported: new Date().toISOString(), state: { ...S, active: null } });
  const name = `chalkbook-backup-${new Date().toISOString().slice(0, 10)}.json`;
  if (downloadsApi) { try { await downloadsApi.save({ filename: name, data: new Blob([data], { type: "application/json" }) }); toast("Backup saved"); return; } catch (e) { if (e?.code === "declined") return; } }
  try { const file = new File([data], name, { type: "application/json" }); if (navigator.canShare?.({ files: [file] })) { await navigator.share({ files: [file], title: "Chalkbook backup" }); return; } } catch (e) { if (e?.name === "AbortError") return; }
  try { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data], { type: "application/json" })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); toast("Backup downloaded"); }
  catch { toast("This view can't save files. Open Chalkbook from your home screen to export."); }
}
function restoreBackup(text) {

  const b = d?.state; if (!b || !Array.isArray(b.workouts)) { toast("That file isn't a Chalkbook backup."); return; }
  let nw = 0, ne = 0, nr = 0;
  for (const [id, e] of Object.entries(b.exercises || {})) if (!S.exercises[id] || e.isCustom || e.edited) { if (!S.exercises[id]) ne++; S.exercises[id] = e; }
  for (const w of b.workouts) if (!S.workouts.some(x => x.id === w.id)) { S.workouts.push(w); nw++; }
  for (const r of b.routines || []) if (!S.routines.some(x => x.id === r.id)) { S.routines.push(r); nr++; }
  Object.assign(S.hevyMap, b.hevyMap || {}); Object.assign(S.ladderPos, b.ladderPos || {});
  if (b.settings) S.settings = Object.assign(S.settings, b.settings);
  save(); render(); toast(`Restored ${nw} workouts, ${ne} exercises, ${nr} routines.`);
}

  "pk-climb"() { const d = topSheet().data; d.climb = !d.climb; drawSheets(); },
  "pk-new"() { exerciseForm({ name: topSheet().data.q, category: "calisthenics", logType: "bodyweight_reps", cues: [] }); },
  "set-type"(el) { const s = S.active.exercises[+el.dataset.ei].sets[+el.dataset.si]; s.t = SET_TYPES[(SET_TYPES.indexOf(s.t) + 1) % SET_TYPES.length]; save(); render(); },
  "set-side"(el) { const s = S.active.exercises[+el.dataset.ei].sets[+el.dataset.si]; s.side = s.side == null ? "L" : s.side === "L" ? "R" : null; save(); render(); },
  "set-done"(el) { completeSet(+el.dataset.ei, +el.dataset.si); },
  "set-add"(el) { const we = S.active.exercises[+el.dataset.ei], last = we.sets[we.sets.length - 1]; we.sets.push({ t: "normal", kg: last?.kg ?? null, reps: null, secs: null, dist: null, side: last?.side === "L" ? "R" : last?.side === "R" ? "L" : null, done: false }); save(); render(); },
  "set-del"(el) { const we = S.active.exercises[+el.dataset.ei]; if (we.sets.length) we.sets.pop(); save(); render(); },
  hold(el) { openHold(+el.dataset.ei, +el.dataset.si); },
  "hold-done"() { if (!OV) return; const secs = OV.start ? Math.round((Date.now() - OV.start) / 1000) : 0; const { ei, si } = OV; OV = null; drawOverlay(); if (!secs) return; S.active.exercises[ei].sets[si].secs = secs; completeSet(ei, si, true); },
  "ov-cancel"() { if (OV?.kind === "guided" && OV.log.length) { finishGuided(); return; } OV = null; drawOverlay(); if (!S.active) keepAwake(false); },
  "gd-pause"() { if (!OV) return; if (OV.paused != null) { OV.phaseEnd = Date.now() + OV.paused; OV.paused = null; } else { OV.paused = OV.phaseEnd - Date.now(); } tickOverlay(); },
  "gd-skip"() { if (!OV) return; OV.paused = null; gdNext(); tickOverlay(); },
  "gd-back"() { if (!OV) return; OV.i = Math.max(0, OV.i - 1); OV.log = OV.log.filter(x => x < OV.i); OV.phase = "ready"; OV.paused = null; OV.phaseEnd = Date.now() + 4000; tickOverlay(); },
  "rest-adj"(el) { const r = S.active?.rest; if (!r) return; r.end += +el.dataset.d * 1000; r.total = Math.max(r.total, (r.end - Date.now()) / 1000); save(); renderRest(); },
  "rest-skip"() { if (S.active) { S.active.rest = null; save(); renderRest(); } },
  "ex-menu"(el) {
    const ei = +el.dataset.ei, we = S.active.exercises[ei];
    menuSheet(ex(we.exerciseId).name, [
      ...[0, 60, 90, 120, 180].map(s => ({ label: s ? `Rest timer ${fmtSecs(s)}` : "No rest timer", sub: we.rest === s ? "Current" : "", run: () => { we.rest = s; save(); render(); } })),
      { label: "Move up", run: () => { if (ei > 0) { const a = S.active.exercises; [a[ei - 1], a[ei]] = [a[ei], a[ei - 1]]; save(); render(); } } },
      { label: "Move down", run: () => { const a = S.active.exercises; if (ei < a.length - 1) { [a[ei + 1], a[ei]] = [a[ei], a[ei + 1]]; save(); render(); } } },
      { label: "Exercise info", run: () => A["ex-open"]({ dataset: { id: we.exerciseId } }) },
      { label: "Remove exercise", danger: true, run: () => { S.active.exercises.splice(ei, 1); save(); render(); } }
    ]);
  },
  async "wk-finish"() { await finishWorkout(); },
  async "wk-discard"() { if (await confirmSheet("Discard workout?", "Everything logged in this workout will be lost.", "Discard", true)) { S.active = null; save(); keepAwake(false); render(); } },
  "wk-save-routine"(el) { const w = S.workouts.find(x => x.id === el.dataset.id); if (w) { sheets.length = 0; routineFromWorkout(w); } },
  "hist-open"(el) { historyDetail(el.dataset.id); },
  "hist-more"() { UI.histN = (UI.histN || 30) + 50; render(); },
  async "hist-del"(el) { const id = el.dataset.id; if (await confirmSheet("Delete workout?", "This removes it from your history and XP. It can't be undone.", "Delete", true)) { S.workouts = S.workouts.filter(w => w.id !== id); save(); sheets.length = 0; drawSheets(); render(); } },
  "ex-open"(el) { const e = ex(el.dataset.id); openSheet({ title: e.name, render: () => exerciseDetail(e.id) }); },
  "ex-add-active"(el) { addExerciseToActive(el.dataset.id); save(); sheets.length = 0; drawSheets(); UI.tab = "train"; render(); toast("Added to workout"); },
  "ex-edit"(el) { exerciseForm(JSON.parse(JSON.stringify(ex(el.dataset.id)))); },
  "ex-dup"(el) { const d = JSON.parse(JSON.stringify(ex(el.dataset.id))); d.id = null; d.name += " (variation)"; d.isCustom = true; d.edited = false; d.ladderId = null; d.ladderStep = null; exerciseForm(d, { title: "New variation" }); },
  async "ex-del"(el) { const id = el.dataset.id, used = S.workouts.some(w => w.exercises.some(x => x.exerciseId === id)); if (await confirmSheet("Delete exercise?", used ? "It's in your history, so past workouts will show it as an unknown exercise." : "This removes it from your library.", "Delete", true)) { delete S.exercises[id]; save(); sheets.length = 0; drawSheets(); render(); } },
  "ex-new"() { exerciseForm({ name: "", category: "calisthenics", logType: "bodyweight_reps", cues: [] }); },
  "exf-save"() { saveExerciseForm(); },
  "lib-add"() { menuSheet("Add exercise", [{ label: "From a creator video", sub: "Claude drafts it from a link or description", run: creatorImport }, { label: "Create my own", sub: "Fill in the details yourself", run: () => A["ex-new"]() }]); },
  "lib-seg"(el) { UI.libSeg = el.dataset.seg; render(); },
  "lib-cat"(el) { UI.cat = el.dataset.cat; render(); },
  "lib-climb"() { UI.climb = !UI.climb; render(); },
  "ladder-set"(el) { S.ladderPos[el.dataset.l] = +el.dataset.p; save(); render(); },
  creator() { creatorImport(); },
  async "ci-draft"() {
    const d = topSheet().data; if (!d.link.trim() && !d.notes.trim()) { toast("Paste a link or describe the exercise."); return; }
    d.busy = true; d.err = ""; drawSheets();
    await fetchVideoInfo(d);
    try { const res = await sampleFn(aiPrompt(d), { modelTier: "quick" }); const draft = parseDraft(res.text); if (!draft.source) draft.source = d.channel || d.link; else if (d.link) draft.source += " · " + d.link; d.busy = false; exerciseForm(draft, { aiDraft: true, title: "Check the draft" }); }
    catch (e) { d.busy = false; d.err = e?.code === "not_granted" ? "Claude wasn't allowed to help in this view. You can still fill it in yourself." : e?.code === "rate_limited" ? "Too many requests just now. Wait a minute and try again." : "Couldn't get a draft. Try again, or fill it in yourself."; drawSheets(); }
  },
  async "ci-copy"() {
    const d = topSheet().data; if (!d.link.trim() && !d.notes.trim()) { toast("Paste a link or describe the exercise."); return; }
    await fetchVideoInfo(d); const p = aiPrompt(d);
    try { await navigator.clipboard.writeText(p); toast("Prompt copied. Paste it into the Claude app."); }
    catch { d.reply = p; drawSheets(); toast("Couldn't copy. The prompt is in the box, select and copy it."); }
    drawSheets();
  },
  "ci-use"() { const d = topSheet().data; try { const draft = parseDraft(d.reply); if (!draft.source && d.link) draft.source = d.link; exerciseForm(draft, { aiDraft: true, title: "Check the draft" }); } catch { d.err = "That reply didn't contain an exercise card. Copy Claude's whole reply and try again."; drawSheets(); } },
  "ci-manual"() { const d = topSheet().data; exerciseForm({ name: "", category: "strength", logType: "weight_reps", cues: [], source: d.link, notes: d.notes }); },
  hevy() { hevyImport(); },
  "hevy-go"() { hevyCommit(); },
  "backup-export"() { exportBackup(); },
  target(el) { S.settings.weeklyTarget = Math.max(1, Math.min(14, S.settings.weeklyTarget + +el.dataset.d)); save(); render(); },
  "rest-def"(el) { S.settings.rest = Math.max(0, Math.min(600, S.settings.rest + +el.dataset.d)); save(); render(); }
};
document.addEventListener("click", e => { const el = e.target.closest("[data-a]"); if (!el) return; const f = A[el.dataset.a]; if (f) { e.preventDefault(); unlockAudio(); f(el, e); } });
document.addEventListener("input", e => {
  const el = e.target, d = topSheet()?.data;
  if (el.dataset.f && S.active) { const s = S.active.exercises[+el.dataset.ei]?.sets[+el.dataset.si]; if (!s) return; const v = num(el.value); if (el.dataset.f === "mins") s.secs = v == null ? null : Math.round(v * 60); else s[el.dataset.f] = v; save(); return; }
  if (el.dataset.w === "title" && S.active) { S.active.title = el.value; save(); return; }
  if (el.dataset.note != null && S.active) { S.active.exercises[+el.dataset.note].note = el.value; save(); return; }
  if (el.id === "lib-q") { UI.q = el.value; $("#lib-list").innerHTML = libRows(filteredExercises(), "ex-open"); return; }
  if (el.id === "pk-q" && d) { d.q = el.value; $("#pk-list").innerHTML = pickerRows(d); return; }
  if (el.dataset.ff && d) { const k = el.dataset.ff; d[k] = el.type === "checkbox" ? el.checked : el.dataset.list != null ? el.value.split(",").map(x => x.trim()).filter(Boolean) : el.dataset.lines != null ? el.value.split("\n").map(x => x.trim()).filter(Boolean) : el.value; return; }
  if (el.dataset.cf && d) { d[el.dataset.cf] = el.value; return; }
  if (el.dataset.rf && d) { d[el.dataset.rf] = el.value; return; }
  if (el.dataset.ri != null && d) { d.items[+el.dataset.ri][el.dataset.rk] = num(el.value); return; }
  if (el.dataset.hm != null && d) { const n = d.data.names.filter(x => !matchName(x.name))[+el.dataset.hm]; if (n) d.map[n.name] = el.value; return; }
});
document.addEventListener("change", async e => {
  const el = e.target;
  if (el.dataset.ff && topSheet()?.data && el.tagName === "SELECT") { topSheet().data[el.dataset.ff] = el.value; return; }
  if (el.id === "hevy-file" && el.files?.[0]) { const d = topSheet().data; try { d.data = readHevy(await el.files[0].text()); d.stage = "review"; d.err = ""; } catch (err) { d.err = err.message || "Couldn't read that file."; } drawSheets(true); return; }
  if (el.id === "backup-in" && el.files?.[0]) { restoreBackup(await el.files[0].text()); el.value = ""; }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && sheets.length) A["sheet-close"](); if (e.key === "Enter" && e.target.classList?.contains("cell")) e.target.blur(); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { if (S.active || OV) keepAwake(true); tick(); } });
document.addEventListener("focusin", e => { if (e.target.classList?.contains("cell")) e.target.select?.(); });

if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
load().then(() => { render(); if (S.active) keepAwake(true); });
</script>
</body>
</html>
